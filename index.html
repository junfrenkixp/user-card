<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <link rel="stylesheet" href="./css/style.css">
  <title>User card</title>
</head>
<body>
  <div class="user-card">
    <img class="user-card__avatar"
         src="./img/avatar.png"
         srcset="./img/avatar.png 1x, ./img/avatar@2x.png 2x"
         height="72"
         width="72"
         alt="User avatar">
    <div class="user-card__info">
      <h1 class="user-card__name">Антон Смирнов</h1>
      <p class="user-card__description">UX/UI дизайнер</p>
      <div class="user-card__button">Написать</div>
    </div>
  </div>
</body>
</html>
